# G2 PC Shell cutover for ghcloud .133 port 40201 only.
# Keep this file under nginx/conf/other/g2/common.conf on the host. Do not
# include it in the 30101 server block.

location = /compositions/prod.resolved.json {
  default_type application/json;
  alias /apps/.g2/prod.resolved.json;
}

location = / {
  proxy_pass http://minio:9090/g2-web-release/pcShell/20260921.65cdd51/index.html;
  proxy_set_header Host minio:9090;
}

location = /index.html {
  proxy_pass http://minio:9090/g2-web-release/pcShell/20260921.65cdd51/index.html;
  proxy_set_header Host minio:9090;
}

location / {
  error_page 404 = @shell_fallback;
  proxy_intercept_errors on;
  proxy_pass http://minio:9090/g2-web-release/pcShell/20260921.65cdd51/;
  proxy_set_header Host minio:9090;
}

location @shell_fallback {
  rewrite ^ /g2-web-release/pcShell/20260921.65cdd51/index.html break;
  proxy_pass http://minio:9090;
  proxy_set_header Host minio:9090;
}

location ^~ /api {
  include cors.conf;
  proxy_pass http://192.168.0.133:3200/;
  rewrite "^/api/(.*)$" /$1 break;
}
location ^~ /scada/api {
  include cors.conf;
  proxy_pass http://192.168.0.133:3100;
}
location ^~ /tools/kkfileview {
  proxy_pass http://192.168.0.133:8012;
  rewrite "^/tools/kkfileview/(.*)$" /$1 break;
}
location ^~ /resource {
  include cache-rule.conf;
  alias /static/;
}
location ^~ /gw-bff {
  include cors.conf;
  proxy_pass http://g2-bff:3000;
}
location ^~ /minio {
  include cache-rule.conf;
  proxy_pass http://192.168.0.133:9091;
  rewrite "^/minio/(.*)$" /$1 break;
}
location ^~ /file {
  proxy_pass http://192.168.0.133:9091;
  rewrite "^/file/(.*)$" /$1 break;
}
location /softswitch {
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Host $host;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
  proxy_pass https://192.168.0.133:7443/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}
location /dispatch {
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Host $host;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
  proxy_pass https://192.168.0.133:60002/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}
location ^~ /visual-ue5-api {
  include cache-rule.conf;
  include cors.conf;
  proxy_pass http://192.168.0.133:25401;
  rewrite "^/visual-ue5-api/(.*)$" /$1 break;
}
location ^~ /api/centerApi {
  proxy_pass http://192.168.0.133:40201;
  rewrite "^/api/centerApi/(.*)$" /api/$1 break;
}
