<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:scada="http://cube-scada.io/ns/v1" viewBox="0 0 100 40">
  <metadata>
    <scada:element>
      <scada:meta type="pipe-straight" label="直管" category="管道" version="1.0.0"/>
      <scada:props>
        <scada:prop name="flowing" type="boolean" label="流动中" default="false" domain="observe" semantic="status.flowing" required="false" bindable="true" controllable="false"/>
        <scada:prop name="color" type="color" label="颜色" default="#B0BEC5" domain="observe" semantic="style.color" required="false" bindable="true" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <scada:map prop="color" selector=".pipe-body" attr="fill"/>
        <scada:map prop="flowing" selector="#flow-dots" attr="opacity" transform="value ? '0.8' : '0'"/>
      </scada:mappings>
    </scada:element>
  </metadata>
  <rect class="pipe-body" x="10" y="10" width="80" height="20" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
  <rect x="5" y="5" width="10" height="30" fill="#90A4AE" stroke="#78909C" stroke-width="1"/>
  <rect x="85" y="5" width="10" height="30" fill="#90A4AE" stroke="#78909C" stroke-width="1"/>
  <line id="flow-dots" x1="15" y1="20" x2="85" y2="20" stroke="#1890ff" stroke-width="4" stroke-dasharray="4,6" opacity="0" style="pointer-events:none"/>
</svg>
