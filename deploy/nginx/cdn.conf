# Local stand-in for the public release CDN origin (prod: c.kaiheai.com).
# Bucket objects are exposed at URL root — not under the main-site /release/ prefix.
server {
  listen 80;
  server_name _;

  # Do not expose MinIO ListBucketResult at "/".
  # If you see this text under the *gateway* hostname, the browser hit this CDN
  # edge (stale DNS / wrong IP) — open the main site gateway host instead.
  location = / {
    charset utf-8;
    default_type "text/plain; charset=utf-8";
    return 404 "g2 release CDN edge (not main site). Use /{logicalName}/{version}/... objects, or open the gateway host for the app.\n";
  }

  # MF remotes + CSS/JS load cross-origin from the main site (gateway).
  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    # Path-style S3: keep Host as the MinIO service, not the browser Host
    # (wrong Host can make MinIO mis-route / list unexpectedly).
    proxy_pass http://minio:9000/g2-web-release/;
    proxy_set_header Host minio:9000;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    # MinIO 会带上 HSTS / CSP；本地 HTTP CDN（:8081）若泄漏 HSTS，浏览器会强制跳 HTTPS，
    # 导致主站 http://localhost:8080 动态 import remoteEntry 报 Failed to fetch。
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type" always;
  }
}
