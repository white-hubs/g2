<html lang="zh-CN">

    <title>G2 PC Shell</title>

  <body>
    <div id="app"></div>
    <script>
      // 对齐旧仓 public/config.js 的最小运行时注入；部署环境可覆盖整段。

        systemName: "华威集团-ghy",
        terminal: "bimops-manage-web",
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
