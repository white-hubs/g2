      applicationCode: DOORMANAGE
      # 菜单归属码：剥 OUAA portal 叶子，改挂 Domain menuContribution（ADR-0062）。
      navigateCodes:
        - DOORMANAGE
        - ACCESS_CONTROL
      # Intent 可跳码：navigate-intent 解析；不剥侧栏。门禁匹配集与菜单归属一致。
      intentCodes:
