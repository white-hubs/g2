<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:scada="http://cube-scada.io/ns/v1"
     viewBox="0 0 108.779 58.037">
  <metadata>
    <scada:element>
      <scada:meta type="pump3" label="离心泵（三）" category="工业设备" version="1.0.0"/>
      <scada:props>
        <scada:prop name="running" type="boolean" label="运行中" default="false" domain="observe" semantic="status.running" required="false" bindable="true" controllable="false"/>
        <scada:prop name="bodyColor" type="color" label="泵体颜色" default="#37A9FF" domain="observe" semantic="style.bodyColor" required="false" bindable="true" controllable="false"/>
        <scada:prop name="wheelColor" type="color" label="叶轮颜色" default="#2A84C3" domain="observe" semantic="style.wheelColor" required="false" bindable="true" controllable="false"/>
        <scada:prop name="label" type="string" label="标签" default="离心泵" domain="observe" semantic="display.label" required="false" bindable="true" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <!-- Body color uses bodyColor when running, dims to gray when stopped -->
        <scada:map prop="running" selector="#housing-main" attr="fill" transform="value === true ? (props.bodyColor || '#37A9FF') : '#aaaaaa'"/>
        <scada:map prop="running" selector=".wheel-accent" attr="fill" transform="value === true ? (props.wheelColor || '#2A84C3') : '#888888'"/>
        <scada:map prop="label" selector="#label-text" attr="textContent"/>
      </scada:mappings>
      <scada:animations>
        <scada:animation
          id="rotate"
          triggerProp="running"
          triggerCondition="value === true"
          target="#impeller"
          keyframes='[{"transform":"rotate(0deg)"},{"transform":"rotate(360deg)"}]'
          duration="1000"
          iterations="Infinity"
          easing="linear"/>
      </scada:animations>
    </scada:element>
  </metadata>

