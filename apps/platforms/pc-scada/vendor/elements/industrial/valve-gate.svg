<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:scada="http://cube-scada.io/ns/v1" viewBox="0 0 100 60">
  <metadata>
    <scada:element>
      <scada:meta type="valve-gate" label="闸阀" category="工业设备" version="1.0.0"/>
      <scada:props>
        <scada:prop name="open" type="boolean" label="开启" default="false" domain="observe" semantic="status.open" required="false" bindable="true" controllable="false"/>
        <scada:prop name="color" type="color" label="颜色" default="#90A4AE" domain="observe" semantic="style.color" required="false" bindable="true" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <scada:map prop="color" selector=".valve-part" attr="fill"/>
      </scada:mappings>
      <scada:animations>
        <scada:animation id="valve-move" triggerProp="open" triggerCondition="value === true" target="#valve-stem" 
          keyframes='[{"transform":"translateY(0)"},{"transform":"translateY(-10px)"}]' duration="500" iterations="1" easing="ease-in-out"/>
      </scada:animations>
    </scada:element>
  </metadata>
  <rect class="valve-part" x="20" y="20" width="60" height="20" fill="#90A4AE" stroke="#455A64" stroke-width="2"/>
  <rect class="valve-part" x="10" y="15" width="10" height="30" fill="#78909C" stroke="#455A64"/>
  <rect class="valve-part" x="80" y="15" width="10" height="30" fill="#78909C" stroke="#455A64"/>
  <g id="valve-handle-group">
    <rect id="valve-stem" x="47" y="5" width="6" height="15" fill="#546E7A"/>
    <rect x="35" y="0" width="30" height="6" rx="2" fill="#D32F2F"/>
  </g>
</svg>
