  <metadata>
    <scada:element>
      <scada:meta type="axial-fan" label="轴流风机" category="风机与通风" version="2.0.0"/>
      <scada:props>
        <scada:prop name="running" type="boolean" label="运行中" default="false" domain="observe" semantic="status.running" bindable="true" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <scada:map prop="running" selector="#fan-outer-ring" attr="fill" transform="value ? '#52c41a' : '#4494bc'"/>
      </scada:mappings>
      <scada:animations>
        <scada:animation
          id="spin"
          triggerProp="running"
          triggerCondition="value === true"
          target="#fan-blades-group"
          keyframes='[{"transform":"rotate(0deg)"},{"transform":"rotate(360deg)"}]'
          duration="1000"
          iterations="Infinity"
          easing="linear"/>
      </scada:animations>
    </scada:element>
  </metadata>

