# WebSocket upgrade (message2 `/api/message2/websocket/msg` etc.)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Resolved profile (prod from `.deploy-out/prod/resolved.json`; ADR-0055)
  location = /compositions/prod.resolved.json {
    default_type application/json;
    alias /var/www/deploy-out/resolved.json;
  }
  location = /compositions/dev.resolved.json {
    default_type application/json;
    alias /var/www/compositions/dev.pc.resolved.json;
  }

  # Release artifacts are NOT served here — browser loads them from the CDN origin
  # (compose service `cdn` / webReleaseBase). Main site only hosts Profile + shell + /api.

  # Backend upstream — prefixes aligned with shell Vite proxy; values from compose env / .env
  # API_UPSTREAM e.g. http://host.docker.internal:3000
  # API_UPSTREAM_HOST e.g. host.docker.internal (Host / SNI for HTTPS)
  location /api/ {
    proxy_pass ${API_UPSTREAM}/api/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # BFF_UPSTREAM defaults to API_UPSTREAM when unset (compose envsubst).
  # Local dual-upstream: API_UPSTREAM=现网 API, BFF_UPSTREAM=http://host.docker.internal:<bff-port>
  location /gw-bff/ {
    proxy_pass ${BFF_UPSTREAM}/gw-bff/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${BFF_UPSTREAM_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /third-auth/ {
    proxy_pass ${API_UPSTREAM}/third-auth/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /resource/ {
    proxy_pass ${API_UPSTREAM}/resource/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /apps-legacy/ {
    proxy_pass ${API_UPSTREAM}/apps-legacy/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /apps/ {
    proxy_pass ${API_UPSTREAM}/apps/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Shell — include generated snippet from `.deploy-out/prod/` (must define location /)
  include /var/www/deploy-out/shell-location.conf;
}
