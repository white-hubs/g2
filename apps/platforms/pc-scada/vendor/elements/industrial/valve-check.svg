<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:scada="http://cube-scada.io/ns/v1" viewBox="0 0 100 60">
  <metadata>
    <scada:element>
      <scada:meta type="valve-check" label="止回阀" category="工业设备" version="1.0.0"/>
      <scada:props>
        <scada:prop name="flowing" type="boolean" label="流动中" default="false" domain="observe" semantic="status.flowing" required="false" bindable="true" controllable="false"/>
        <scada:prop name="color" type="color" label="颜色" default="#90A4AE" domain="observe" semantic="style.color" required="false" bindable="true" controllable="false"/>
      </scada:props>
      <scada:mappings>
        <scada:map prop="color" selector=".valve-part" attr="fill"/>
        <scada:map prop="flowing" selector="#check-flap" attr="transform" transform="value ? 'rotate(-45, 40, 30)' : 'rotate(0, 40, 30)'"/>
      </scada:mappings>
    </scada:element>
  </metadata>
  <rect class="valve-part" x="10" y="20" width="80" height="30" fill="#90A4AE" stroke="#455A64" stroke-width="2"/>
  <line x1="40" y1="20" x2="40" y2="50" stroke="#455A64" stroke-width="2"/>
  <rect id="check-flap" x="40" y="22" width="4" height="26" fill="#D32F2F" transform="rotate(0, 40, 30)"/>
</svg>
