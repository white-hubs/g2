<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:scada="https://cube-scada.guhecloud.com/ns/v1"
     viewBox="0 0 80 80"
     width="80" height="80">
  <metadata>
    <scada:element>
      <scada:meta type="ct-sensor" label="CT&#x91C7;&#x96C6;&#x8BBE;&#x5907;" category="electrical" version="1.0.0"/>
      <scada:props/>
      <scada:mappings/>
      <scada:animations/>
    </scada:element>
  </metadata>

  <defs>
    <linearGradient id="ct-body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a4a4a"/>
      <stop offset="25%"  stop-color="#303030"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="ct-bevel-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <rect x="5" y="6" width="72" height="72" rx="12" fill="#000" opacity="0.35"/>

  <!-- Main body -->
  <rect x="3" y="3" width="74" height="74" rx="12"
    fill="url(#ct-body-grad)" stroke="#111" stroke-width="1.2"/>

  <!-- Top bevel highlight -->
  <rect x="4" y="4" width="72" height="28" rx="11"
    fill="url(#ct-bevel-top)"/>

  <!-- Left edge subtle highlight -->
  <rect x="4" y="4" width="5" height="72" rx="4"
    fill="#fff" opacity="0.05"/>

  <!-- CT text -->
  <text x="40" y="50"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="30"
    letter-spacing="1"
    fill="#e0e0e0"
    text-anchor="middle">CT</text>

</svg>
